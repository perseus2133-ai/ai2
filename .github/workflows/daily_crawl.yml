name: 📊 Daily Stock Crawl

on:
  schedule:
    # 매일 오전 2시 KST 예약 (= 17:00 UTC 전날).
    # GitHub Actions 스케줄러는 정시 보장이 없어 1~4시간까지 지연된다.
    # 지연되어도 장 시작(09:00) 전에 끝나야 한다 — 09:00 이후에 종목
    # 리스트를 받으면 시가총액 페이지의 '거래량'이 당일 진행분(장 시작
    # 직후엔 0)으로 잡혀 거래량 필터가 전 종목을 걸러낸다.
    # (2026-09-01: 09:00 정각 수집 → 전 종목 거래량 0 사고)
    - cron: '0 17 * * *'
  workflow_dispatch:
    # 수동 실행 버튼 (GitHub Actions 탭에서 직접 실행 가능)
    inputs:
      reason:
        description: '수동 실행 사유'
        required: false
        default: '수동 크롤링'

permissions:
  contents: write

concurrency:
  group: ai2-daily-crawl
  cancel-in-progress: false

# Node.js 20 deprecation 대응: 액션들을 Node.js 24로 강제 실행
# (2026-06-16부터 GitHub이 자동 전환 예정 - 미리 opt-in)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  crawl:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 140  # FnGuide 동시성 세마포어(8)로 크롤 ~87분 소요 → 느린 날 여유 확보

    steps:
      - name: ⬇️ 코드 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 패키지 설치
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 회귀 테스트
        run: python -m pytest -q

      - name: 🔄 크롤링 실행
        run: python crawl_script.py

      # 장애 데이터를 매매·게시하기 전에 차단한다.
      - name: 🩺 당일 데이터 및 FnGuide 검증
        run: |
          python data_quality.py
          python check_fnguide_health.py

      # 모의투자: 매일 평가액 기록 + 7일 경과 시 주간 리밸런싱
      # (fresh CSV 기반, 결과는 data/paper_trading/ → 아래 push에 포함)
      - name: 💰 모의투자 평가/리밸런싱
        run: python paper_trading.py --auto

      # 부가 성과 수집 실패로 정상 수집/추천 게시를 막지 않는다.
      # 실패 시 이전 보고서는 앱의 기록·시점 검증에 의해 숨겨진다.
      - name: 📈 데일리 추천 시장 대비 성과
        id: performance
        continue-on-error: true
        run: python picks_performance.py

      - name: 💾 데이터 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # 변경사항 없으면 exit 0 (에러 없이 종료)
          git diff --staged --quiet && echo "변경사항 없음" && exit 0
          git commit -m "🤖 Auto crawl: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          git push

      # 데이터 push 완료 후 알림. 실패 시 run도 실패하되 커밋된 데이터는 보존.
      - name: 📨 카카오톡 알림 (AI 3선)
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python kakao_send.py

      - name: 성과 수집 실패 표시
        if: always() && steps.performance.outcome == 'failure'
        run: |
          echo "::error::성과 수집 실패. 정상 데이터 게시와 별개로 성과 비교표 갱신을 확인하세요."
          exit 1
